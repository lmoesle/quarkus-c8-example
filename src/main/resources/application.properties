quarkus.http.host=127.0.0.1
quarkus.http.port=8080
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=bikerepair
quarkus.datasource.password=bikerepair
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/bikerepair
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.mailer.from=werkstatt@bikeshop.example
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.tls=false
quarkus.mailer.start-tls=DISABLED
quarkus.mailer.mock=false
quarkus.process-engine-api.c8.enabled=true
quarkus.process-engine-api.c8.service-tasks.delivery-strategy=SUBSCRIPTION
quarkus.process-engine-api.c8.service-tasks.worker-id=bike-repair
quarkus.process-engine-api.c8.user-tasks.delivery-strategy=SCHEDULED
quarkus.process-engine-api.c8.user-tasks.schedule-delivery-fixed-rate-in-seconds=2
quarkus.process-engine-api.c8.client.grpc-address=http://localhost:26500
quarkus.process-engine-api.c8.client.rest-address=http://localhost:8088
quarkus.process-engine-api.c8.client.prefer-rest-over-grpc=true
quarkus.process-engine-api.c8.client.request-timeout=PT45S
dev.bpm-crafters.process-api.worker.enabled=true
dev.bpm-crafters.process-api.worker.register-process-workers=true
dev.bpm-crafters.process-api.worker.complete-tasks-before-commit=false
dev.bpm-crafters.process-api.worker.remove-task-result-on-completion=true
dev.bpm-crafters.process-api.worker.deployment.enabled=true
dev.bpm-crafters.process-api.worker.deployment.bpmn-resource-pattern=classpath*:/bpmn/bike-repair.bpmn
# This snapshot treats the DMN slot as a generic second pattern; bundle deployment-bound forms too.
dev.bpm-crafters.process-api.worker.deployment.dmn-resource-pattern=classpath*:/forms/*.form
bike-repair.offer-validity=P14D
bike-repair.public-url=http://localhost:8080
